.badge{color:var(--new);font-weight:700;font-size:12px;margin-left:4px}
.lg{display:inline-block;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;margin-right:6px}
.today{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 0;margin-bottom:12px}
.today h2{font-size:15px;margin:8px 16px;color:var(--new)}
#pl{position:fixed;inset:0;background:#000;z-index:9;display:none;flex-direction:column}#pl.on{display:flex}
#fw{flex:1;display:flex}#fw iframe{flex:1;width:100%;border:0}

const $=id=>document.getElementById(id);
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=null, list=[], curKey='';
function btn(r,i,lst){
  const soon=!r.v;
  return `<button class="v${soon?' soon':''}" ${soon?'disabled':''} data-i="${i}" data-l="${lst}"><span class="p">${soon?'…':'▶'}</span>`+
    `<span class="tt">${r.L?'<span class="lg">총정리</span>':''}${esc(r.t)}${r.new?'<span class="badge">NEW</span>':''}</span><span class="du">${soon?'곧 올라와요':mmss(r.d)}</span></button>`;
}
const lists={};
function show(subj){
  try{localStorage.setItem('omni_subj',subj)}catch(e){}
  document.querySelectorAll('#subj button').forEach(b=>b.classList.toggle('on',b.dataset.s===subj));
  const units=[...new Set(D.filter(r=>r.s===subj).map(r=>r.u))];
  $('units').innerHTML=units.map((u,k)=>{
    const rs=D.filter(r=>r.s===subj&&r.u===u).sort((a,b)=>b.L-a.L), key=subj+'|'+u, live=rs.filter(r=>r.v).length;
    lists[key]=rs;
    return `<details${k===0?' open':''}><summary>${u} ${esc(rs[0].un||'')}<small>${live} / ${rs.length}</small></summary>`+
      rs.map((r,i)=>btn(r,i,key)).join('')+`</details>`;
  }).join('');
}
function open(lst,i){

}
function close(fromPop){
